# CI — the phase-1 gate set from docs/specs/SPECS.md §2:
# gofmt, go vet, go build (linux, windows and darwin), go test -race, plus
# shellcheck on install.sh. All stdlib-only, no secrets needed.
# Plus the authorship gate: a PR whose commits are authored or co-authored by
# an AI agent fails before the Go steps (scripts/ci/check-agent-authors.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt · vet · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the authorship gate walks the PR's commits against
          # their base, so it needs the base branch, not a shallow head.
          fetch-depth: 0

      - name: Fetch the PR base branch
        if: github.event_name == 'pull_request'
        run: >
          git fetch --no-tags origin
          "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      # Runs before the Go steps: an agent-attributed commit is a one-way door
      # (GitHub keeps crediting it after a rewrite), so fail on it first.
      - name: Reject agent authors and co-authors
        if: github.event_name == 'pull_request'
        run: >
          python3 scripts/ci/check-agent-authors.py
          --range "origin/${{ github.base_ref }}..HEAD"

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # OS-specific source files (//go:build windows / !windows /
      # !(linux||darwin||…)) are excluded from every step above, which runs on
      # linux: a PR that breaks one would stay green here and only fail the
      # Release workflow weeks later. Compile both other targets explicitly.
      - name: go build (windows)
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: go build (darwin)
        run: GOOS=darwin GOARCH=amd64 go build ./...

      # install.sh is the one script every new user runs (`curl | bash`) and it
      # carries checksum, asset-name and package-manager logic. shellcheck ships
      # on the ubuntu runners.
      - name: shellcheck install.sh
        run: |
          bash -n install.sh
          shellcheck -S warning install.sh

      - name: go test -race
        run: go test ./... -race

  # The native matrix (R35/R60/R66): the codemode reactor is an embedded WASM
  # module whose host is Go, but "hermetic on Linux" is not "works on the three
  # shipped platforms". This job builds the real binary and drives it through
  # the codemode gate on each OS, so a wazero/OS-specific regression fails here
  # instead of at release. Dispatchable on its own for a candidate SHA.
  native:
    name: codemode gate (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        run: go build -o bin/moca ./cmd/moca

      - name: Codemode gate
        shell: bash
        run: go test -tags codemodegate -count=1 ./test/codemodegate -args -moca bin/moca
