# Release — build the platform packages and publish them as a GitHub
# Release. Triggered manually only (Actions -> Release -> Run workflow):
# a `v*` tag push deliberately does NOT trigger it — publishing is an
# explicit action, decided by the maintainer. Run it from a tagged ref
# (e.g. main after tagging) to name the release by the tag.
#
# The published assets are the contract `moca update` consumes
# (internal/update.go): moca-<version>-<os>-<arch>.tar.gz (a .zip on
# Windows) + checksums.txt — keep the two in sync if either side changes.
# Six targets: linux, darwin and windows on amd64 and arm64 — the same set
# `make release` cross-compiles locally. darwin is published (not local-only
# any more) because a Homebrew formula installs a prebuilt tarball only when
# one exists — the alternative puts a Go toolchain on every macOS user's
# machine — and because the ACP registry rejects a `binary` distribution that
# does not cover darwin, linux and windows.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release to build and publish: an existing tag (e.g. v1.2.3) — its
          source is built, with this ref's workflow steps. Leave empty to
          publish what the dispatched ref describes (git describe) — which
          needs main to sit exactly on the tag. The input exists because a fix
          to THIS workflow lands after the tag it publishes: dispatch from
          main with version set instead of moving the tag.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      # With `version` set, the SOURCE is that tag's tree while the steps
      # stay the dispatched ref's — the point of the input is a workflow fix
      # that landed after the tag, never main's newer code shipped under the
      # tag's name (GitHub reads the workflow file from the dispatched ref
      # whatever this step checks out). Fully qualified, so only a tag can
      # match: a branch that shares the tag's name never gets built.
      - name: Checkout (full history — git describe needs the tag)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
            # a release never invents a tag: the version it publishes has to
            # exist already, so the assets name a commit that carries them
            git rev-parse -q --verify "refs/tags/$version" >/dev/null || {
              echo "version $version is not an existing tag — dispatch from that tag, or tag the commit first"; exit 1; }
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist/pkg
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/adeotek/moca/internal/config.Version=$version" \
            -o "dist/pkg/moca$ext" ./cmd/moca
          # target_ok <path> <goos> <goarch>: the Go toolchain records the
          # build target in the binary, and `go version -m` reads it from any
          # Go binary whatever the host — unlike `file`, whose wording for the
          # machine type drifts between magic databases ("ARM64" on Fedora 44,
          # "Aarch64" on the Ubuntu runners, which failed v0.7.6's
          # windows/arm64 job on a correctly built binary). A mislabelled
          # package installs fine and then refuses to start, so every target is
          # checked, not just the cross-compiled ones.
          target_ok() {
            go version -m "$1" | awk -v o="$2" -v a="$3" '
              $1 == "build" && $2 == "GOOS=" o   { os = 1 }
              $1 == "build" && $2 == "GOARCH=" a { arch = 1 }
              END { exit !(os && arch) }'
          }
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "$(go env GOHOSTARCH)" ]; then
            # only the runner's own architecture can be executed here
            out="$(./dist/pkg/moca --version)"
            [ "$out" = "moca $version" ] || { echo "version stamp mismatch: $out (want moca $version)"; exit 1; }
          fi
          target_ok "dist/pkg/moca$ext" "$GOOS" "$GOARCH" || {
            echo "not a $GOOS/$GOARCH build:"
            go version -m "dist/pkg/moca$ext"
            file -b "dist/pkg/moca$ext"
            exit 1
          }
          cp LICENSE dist/pkg/
          ( cd dist/pkg
            if [ "$GOOS" = "windows" ]; then
              zip -q -r "../moca-$version-$GOOS-$GOARCH.zip" moca.exe LICENSE
            else
              tar -czf "../moca-$version-$GOOS-$GOARCH.tar.gz" moca LICENSE
            fi )

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: moca-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history — git describe needs the tag)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum moca-* > checksums.txt
          cat checksums.txt

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
            git rev-parse -q --verify "refs/tags/$version" >/dev/null || {
              echo "version $version is not an existing tag — dispatch from that tag, or tag the commit first"; exit 1; }
          else
            version="$(git describe --tags --always --dirty)"
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/* --clobber
          elif git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            gh release create "$version" dist/* --title "$version" --generate-notes
          else
            # manual dispatch from a branch (a rehearsal): a draft, so
            # `moca update` and the installers never pick up the dev build;
            # publish it by hand if it is meant to ship
            gh release create "$version" dist/* --title "$version" --generate-notes --target "$GITHUB_SHA" --draft
          fi
