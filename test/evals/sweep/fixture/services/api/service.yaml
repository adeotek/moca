# api — managed by platform-config; change it in the deploy repo, not here.
apiVersion: v1
kind: ServiceManifest
metadata:
  name: api
  team: platform
  tier: frontend
  labels:
    env: production
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
    billing/unit: request
spec:
  image: registry.internal/api:1.4.2
  replicas: 3
  resources:
    cpu: 500m
    memory: 1Gi
  env:
    - name: LOG_LEVEL
      value: info
    - name: OTEL_EXPORTER
      value: otlp
    - name: HTTP_IDLE_TIMEOUT
      value: "30s"
  probes:
    readiness: /healthz
    liveness: /livez
    startup: /startupz
  rollout:
    strategy: rolling
    maxUnavailable: 1
  policy: shared-a
