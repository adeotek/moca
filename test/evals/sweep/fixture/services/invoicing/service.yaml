# invoicing — managed by platform-config; change it in the deploy repo, not here.
apiVersion: v1
kind: ServiceManifest
metadata:
  name: invoicing
  team: payments
  tier: worker
  labels:
    env: production
    app.kubernetes.io/name: invoicing
    app.kubernetes.io/part-of: storefront
    billing/unit: cpu-hour
spec:
  image: registry.internal/invoicing:1.4.2
  replicas: 2
  resources:
    cpu: 1500m
    memory: 512Mi
  env:
    - name: LOG_LEVEL
      value: info
    - name: OTEL_EXPORTER
      value: otlp
    - name: HTTP_IDLE_TIMEOUT
      value: "30s"
  probes:
    readiness: /healthz
    liveness: /livez
    startup: /startupz
  rollout:
    strategy: rolling
    maxUnavailable: 1
  policy: shared-c
  # suspended after the 2026-11 reorg
  disabled: true
