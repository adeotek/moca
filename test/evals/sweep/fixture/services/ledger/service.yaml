# ledger — managed by platform-config; change it in the deploy repo, not here.
apiVersion: v1
kind: ServiceManifest
metadata:
  name: ledger
  team: content
  tier: backend
  labels:
    env: production
    app.kubernetes.io/name: ledger
    app.kubernetes.io/part-of: storefront
    billing/unit: cpu-hour
spec:
  image: registry.internal/ledger:1.4.2
  replicas: 3
  resources:
    cpu: 300m
    memory: 256Mi
  env:
    - name: LOG_LEVEL
      value: info
    - name: OTEL_EXPORTER
      value: otlp
    - name: HTTP_IDLE_TIMEOUT
      value: "30s"
  probes:
    readiness: /healthz
    liveness: /livez
    startup: /startupz
  rollout:
    strategy: rolling
    maxUnavailable: 1
  policy: shared-b
