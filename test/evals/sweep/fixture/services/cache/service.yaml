# cache — managed by platform-config; change it in the deploy repo, not here.
apiVersion: v1
kind: ServiceManifest
metadata:
  name: cache
  team: edge
  tier: edge
  labels:
    env: production
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: backoffice
    billing/unit: request
spec:
  image: registry.internal/cache:1.4.2
  replicas: 5
  resources:
    cpu: 200m
    memory: 128Mi
  env:
    - name: LOG_LEVEL
      value: info
    - name: OTEL_EXPORTER
      value: otlp
    - name: HTTP_IDLE_TIMEOUT
      value: "30s"
  probes:
    readiness: /healthz
    liveness: /livez
    startup: /startupz
  rollout:
    strategy: rolling
    maxUnavailable: 1
  policy: shared-a
