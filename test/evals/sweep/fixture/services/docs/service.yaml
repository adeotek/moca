# docs — managed by platform-config; change it in the deploy repo, not here.
apiVersion: v1
kind: ServiceManifest
metadata:
  name: docs
  team: data
  tier: backend
  labels:
    env: production
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: backoffice
    billing/unit: cpu-hour
spec:
  image: registry.internal/docs:1.4.2
  replicas: 2
  resources:
    memory: 512Mi
  env:
    - name: LOG_LEVEL
      value: info
    - name: OTEL_EXPORTER
      value: otlp
    - name: HTTP_IDLE_TIMEOUT
      value: "30s"
  probes:
    readiness: /healthz
    liveness: /livez
    startup: /startupz
  rollout:
    strategy: rolling
    maxUnavailable: 1
  policy: shared-a
