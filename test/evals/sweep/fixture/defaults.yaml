# Platform defaults. Every services/*/service.yaml inherits every value it
# does not state itself; a service that states a value overrides it wholesale.
apiVersion: v1
kind: PlatformDefaults
metadata:
  name: platform-defaults
  owner: platform-team
spec:
  replicas: 2
  resources:
    cpu: 250m
    memory: 256Mi
  rollout:
    strategy: rolling
    maxUnavailable: 1
  policy: shared-a
